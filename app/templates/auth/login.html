<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — RecuraOps</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/recuraops-logo.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>window.FIREBASE_CONFIG = {{ firebase_config | tojson }};</script>
  <style>
    body{background:var(--bg-primary);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .login-wrap{width:100%;max-width:420px}
    .login-card{background:var(--bg-card);border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow-soft);padding:44px 40px 36px}
    .login-logo{text-align:center;margin-bottom:28px}
    .login-logo-img{width:72px;height:72px;object-fit:contain;border-radius:16px;background:#1a2a1a;padding:6px;margin-bottom:12px;box-shadow:0 4px 16px rgba(61,122,94,.15);display:block;margin-left:auto;margin-right:auto}
    .login-brand-name{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:700;color:var(--accent-forest);margin:0 0 4px}
    .login-tagline{font-family:'DM Sans',sans-serif;font-size:.85rem;color:var(--text-muted);margin:0 0 28px;text-align:center}
    .form-group{margin-bottom:18px}
    .form-label{display:block;font-size:.82rem;font-weight:600;color:var(--accent-slate);margin-bottom:6px}
    .input-wrap{position:relative}
    .form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:.9rem;font-family:'DM Sans',sans-serif;background:var(--bg-card);color:var(--text-primary);transition:var(--transition);outline:none}
    .form-input:focus{border-color:var(--accent-forest);box-shadow:0 0 0 3px rgba(61,122,94,.12)}
    .input-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);display:flex}
    .input-icon svg{width:16px;height:16px}
    .error-box{display:none;align-items:center;gap:8px;background:var(--pastel-rose);border:1px solid #f0b4c0;border-radius:var(--radius-sm);padding:11px 14px;color:#9b2335;font-size:.85rem;margin-bottom:16px}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    .error-box.shake{animation:shake .4s ease}
    .btn-login{width:100%;padding:12px;background:var(--accent-forest);color:white;border:none;border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-login:hover{background:var(--accent-forest-dk);transform:translateY(-1px);box-shadow:0 4px 16px rgba(61,122,94,.25)}
    .btn-login:disabled{opacity:.7;cursor:not-allowed;transform:none}
    .demo-section{margin-top:24px;border:1px dashed var(--border);border-radius:var(--radius-md);overflow:hidden}
    .demo-toggle{width:100%;padding:10px 16px;background:var(--bg-subtle);border:none;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--text-muted);display:flex;align-items:center;justify-content:space-between;font-family:'DM Sans',sans-serif;letter-spacing:.04em;text-transform:uppercase}
    .demo-body{display:none;padding:12px 16px;background:var(--bg-card)}
    .demo-body.open{display:block}
    .demo-cred{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 12px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:var(--transition);font-family:'DM Sans',sans-serif;font-size:.8rem}
    .demo-cred:hover{background:var(--pastel-mint);border-color:var(--accent-forest)}
    .demo-cred:last-child{margin-bottom:0}
    .demo-email{font-weight:600;color:var(--text-primary)}
    .demo-role{color:var(--text-muted);font-size:.72rem}
    .login-footer{text-align:center;margin-top:20px;font-size:.72rem;color:var(--text-muted)}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img
          src="{{ url_for('static', filename='images/recuraops-logo.png') }}"
          alt="RecuraOps"
          class="login-logo-img"
        />
        <h1 class="login-brand-name">RecuraOps</h1>
        <p class="login-tagline">Autonomous Cost Intelligence Engine</p>
      </div>
      <div class="error-box" id="error-box">
        <i data-lucide="alert-circle" style="width:16px;height:16px;flex-shrink:0"></i>
        <span></span>
      </div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email" placeholder="you@company.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="password" placeholder="••••••••••" autocomplete="current-password" required style="padding-right:42px">
            <button type="button" class="input-icon" id="toggle-password"><i data-lucide="eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="submit-btn">
          <span id="btn-spinner" class="spinner" style="display:none;width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.3);border-top-color:white"></span>
          <span id="btn-text">Sign In</span>
        </button>
      </form>
      <div class="demo-section">
        <button class="demo-toggle" onclick="this.nextElementSibling.classList.toggle('open')">
          <span>Demo Credentials</span><i data-lucide="chevron-down" style="width:14px;height:14px"></i>
        </button>
        <div class="demo-body">
          <button class="demo-cred" data-email="admin@recuraops.io" data-password="RecuraAdmin@2025">
            <span class="demo-email">admin@recuraops.io</span><span class="demo-role">CFO · Admin</span>
          </button>
          <button class="demo-cred" data-email="analyst@recuraops.io" data-password="RecuraAnalyst@2025">
            <span class="demo-email">analyst@recuraops.io</span><span class="demo-role">Cost Analyst</span>
          </button>
          <button class="demo-cred" data-email="approver@recuraops.io" data-password="RecuraApprover@2025">
            <span class="demo-email">approver@recuraops.io</span><span class="demo-role">Finance Manager</span>
          </button>
        </div>
      </div>
    </div>
    <div class="login-footer">RecuraOps © 2025 · Autonomous Cost Recovery Platform</div>
  </div>
  <script src="{{ url_for('static', filename='js/firebase-init.js') }}"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
